# ── Редиректы других доменов → vsb39.ru ───────────────────────
server {
    listen 443 ssl;
    server_name vsb-39.ru www.vsb-39.ru www.vsb39.ru;
    ssl_certificate /etc/letsencrypt/live/vsb39.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vsb39.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://vsb39.ru$request_uri;
}

# ── Основной сайт vsb39.ru ──────────────────────────────────
server {
    listen 443 ssl;
    server_name vsb39.ru 195.14.118.66;
    client_max_body_size 50m;

    ssl_certificate /etc/letsencrypt/live/vsb39.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vsb39.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/vsb39/html;
    index index.html;
    sendfile off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Система ТО (React SPA) — ^~ = выше regex, всё /to/* → Docker ──
    # Включает /to/, /to/login, /to/dashboard, /to/assets/*.js, etc.
    location ^~ /to/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }

    # ── API сметы → Smeta_app (порт 8002) ───────────────────
    location /api/smeta/ {
        proxy_pass http://127.0.0.1:8002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
    }

    # ── API системы ТО → secureto backend (порт 8001) ───────
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8001/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
    }

    # ── Backward compat ──────────────────────────────────────
    location /api/to/ {
        proxy_pass http://127.0.0.1:8001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
    }

    # # VSB_SEO_ROUTES_V1 — sitemap.xml и robots.txt отдаёт smeta-backend (динамика)
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8002/sitemap.xml;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
    location = /robots.txt {
        proxy_pass http://127.0.0.1:8002/robots.txt;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # ── Главный сайт (SPA fallback) ─────────────────────────
    # # VSB_NOCACHE_INDEX_V1
    location = / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires 0;
        try_files /index.html =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires 0;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Кэш статики ГЛАВНОГО сайта (не трогает /to/) ────────
    # NOTE: эти файлы из /var/www/vsb39/html/, не из Docker
    location ~* \.css$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
    location ~* \.(jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|map)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location ~ /\. { deny all; }

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;

    access_log /var/log/nginx/vsb39_access.log;
    error_log  /var/log/nginx/vsb39_error.log;
}

# ── HTTP → HTTPS ─────────────────────────────────────────────
server {
    listen 80;
    server_name vsb39.ru www.vsb39.ru vsb-39.ru www.vsb-39.ru 195.14.118.66;
    return 301 https://vsb39.ru$request_uri;
}
